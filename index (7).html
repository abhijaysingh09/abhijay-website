<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhijay Singh | Engineering Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#E8EEF4;--panel:#FFFFFF;--ink:#14202C;--mute:#566474;--line:#B7C3D0;--accent:#1F5FBF;--accent-ink:#FFF;--grid:rgba(31,95,191,.07);--grid2:rgba(31,95,191,.14);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A2B;--panel:#16243A;--ink:#E6EDF6;--mute:#93A4B8;--line:#2E4260;--accent:#7FB0FF;--accent-ink:#0B1424;--grid:rgba(127,176,255,.08);--grid2:rgba(127,176,255,.16)}}
:root[data-theme="dark"]{--bg:#0F1A2B;--panel:#16243A;--ink:#E6EDF6;--mute:#93A4B8;--line:#2E4260;--accent:#7FB0FF;--accent-ink:#0B1424;--grid:rgba(127,176,255,.08);--grid2:rgba(127,176,255,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 "Source Serif 4",Georgia,serif;
 background-image:radial-gradient(ellipse 90% 45% at 50% 0,var(--grid2),transparent 70%);background-repeat:no-repeat}
h1,h2,h3,.mono,nav,button{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:4px;overflow-x:auto;align-items:center;height:56px}
.top b{font:800 16px Archivo,sans-serif;margin-right:auto;white-space:nowrap;padding-right:16px}
.top a{font:600 14px Archivo,sans-serif;text-decoration:none;color:var(--mute);padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.top a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
header.hero{padding:56px 0 32px}
.hero h1{font-size:clamp(46px,9vw,96px);font-weight:800;letter-spacing:-.03em;margin:8px 0 0}
.hero .sub{font:600 clamp(18px,2.6vw,24px) Archivo,sans-serif;color:var(--accent);margin:12px 0 0}
.hero .intro{color:var(--mute);margin:20px 0 0}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:2px solid var(--ink);background:var(--panel);margin-top:32px}
.tb div{padding:10px 14px;border-right:1px solid var(--line)}.tb div:last-child{border-right:0}
.tb span{display:block;font:500 15px Archivo,sans-serif}
.view{position:relative;margin-top:24px;background:#fff;border:2px solid var(--ink);padding:8px}
.view img{display:block;width:100%;max-height:520px;object-fit:contain}
.view .mono{position:absolute;left:10px;bottom:8px;background:#fff;padding:0 4px;color:#566474}
.view i{position:absolute;width:18px;height:18px;border-color:var(--accent);border-style:solid;border-width:0}
.view i:nth-of-type(1){top:-2px;left:-2px;border-top-width:4px;border-left-width:4px}
.view i:nth-of-type(2){top:-2px;right:-2px;border-top-width:4px;border-right-width:4px}
.view i:nth-of-type(3){bottom:-2px;left:-2px;border-bottom-width:4px;border-left-width:4px}
.view i:nth-of-type(4){bottom:-2px;right:-2px;border-bottom-width:4px;border-right-width:4px}
section.blk{padding:64px 0 8px}
.sh{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:28px}
.sh h2{font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:-.02em}
details.job{background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
details.job summary{cursor:pointer;padding:16px 20px;list-style:none;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
details.job summary::-webkit-details-marker{display:none}
details.job summary::before{content:"+";font:700 20px "IBM Plex Mono",monospace;color:var(--accent);width:18px}
details.job[open] summary::before{content:"\2212"}
details.job h3{font-size:20px;margin:0}details.job ul{margin:0;padding:0 20px 18px 54px;color:var(--mute)}details.job li{margin-bottom:8px}
details.job p{margin:0;padding:0 20px 18px 54px;color:var(--mute)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{font:500 14px Archivo,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);margin:24px 0;padding:24px;border-left:6px solid var(--accent)}
.card h3{font-size:clamp(24px,3.6vw,34px);letter-spacing:-.02em;margin:4px 0 12px}
.card .lead{margin:0 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gal button{all:unset;cursor:zoom-in;display:block;background:#fff;border:1px solid var(--line)}
.gal button:focus-visible{outline:3px solid var(--accent)}
.gal img{display:block;width:100%;height:260px;object-fit:contain}.gal .p img{object-fit:cover}
.gal span{display:block;font:500 13px Archivo,sans-serif;color:var(--mute);padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.cols{display:grid;grid-template-columns:1fr;gap:4px 32px;margin-top:20px}.cols h4{margin:0 0 4px;font:700 17px Archivo,sans-serif}.cols p{margin:0 0 14px;color:var(--mute)}
.skg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.skg div{background:var(--panel);border:1px solid var(--line);padding:16px}.skg h3{font-size:16px;margin:0 0 10px}
.skg .chip{margin:0 6px 6px 0;display:inline-block}.skg span.chip{cursor:default}
footer{padding:56px 0 80px;color:var(--mute)}
dialog{border:2px solid var(--ink);background:#fff;padding:0;max-width:min(94vw,1100px);width:100%}dialog::backdrop{background:rgba(8,14,24,.8)}
dialog img{display:block;width:100%;max-height:80vh;object-fit:contain;background:#fff}
dialog .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);color:var(--ink)}
dialog .bar p{margin:0 auto 0 0;font:500 14px Archivo,sans-serif}
@media (max-width:760px){.tb{grid-template-columns:1fr 1fr}.tb div:nth-child(2){border-right:0}.cols{grid-template-columns:1fr}body{font-size:17px}}
</style></head><body>

</header>
<section class="blk" id="experience"><div class="sh"><span class="mono">01</span><h2>Experience and education</h2></div><div id="exp"></div></section>

<p class="mono" style="margin-top:12px">Tap a highlighted skill to see the projects that use it.</p></section>
<footer id="contact"><div class="sh"><span class="mono">04</span><h2 style="color:var(--ink)">Contact</h2></div><p id="ct"></p><div class="tb" id="tb"></div><p class="mono" style="margin-top:20px">&copy; Abhijay Singh</p></footer>
</div>

      if(im.photo)b.className="p";b.onclick=()=>lbOpen(g[1],i);gal.appendChild(b)})};
  if(groups.length>1){const tabs=el("div",{"class":"tabs",role:"group","aria-label":"Image type"});
    groups.forEach((g,i)=>{const t=el("button",{type:"button","class":"chip",text:g[0],"aria-pressed":String(i===0)});
      t.onclick=()=>{tabs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));t.setAttribute("aria-pressed","true");draw(g)};tabs.appendChild(t)});box.appendChild(tabs)}
  draw(groups[0]);box.appendChild(gal);return box}
function card(p,n){
  const c=el("article",{"class":"card"});
  c.appendChild(el("span",{"class":"mono",text:"DWG-"+String(n).padStart(2,"0")+" / "+(p.category||"")}));
  c.appendChild(el("h3",{text:p.title}));
  if(p.tags&&p.tags.length){const u=el("ul",{"class":"tags"});p.tags.forEach(t=>{const b=el("button",{type:"button","class":"chip",text:t,"aria-pressed":String(tag===t)});b.onclick=()=>{tag=tag===t?null:t;render()};u.appendChild(el("li",{},[b]))});c.appendChild(u)}
  c.appendChild(el("p",{"class":"lead",text:p.summary}));
  const g=gallery(p);if(g)c.appendChild(g);
  if(p.details&&p.details.length)c.appendChild(el("div",{"class":"cols"},p.details.map(d=>el("div",{},[el("h4",{text:d.label}),el("p",{text:d.text})]))));
  if(p.links&&p.links.length)c.appendChild(el("p",{},p.links.map(l=>el("a",{href:l.url,text:l.label+" "}))));
  return c}
const F=$("filters"),L=$("plist");
function render(){
  const cats=[...new Set(PROJECTS.map(p=>p.category).filter(Boolean))];
  F.replaceChildren();
  if(cats.length>1)["All",...cats].forEach(c=>{const b=el("button",{type:"button","class":"chip",text:c,"aria-pressed":String(c===cat)});b.onclick=()=>{cat=c;render()};F.appendChild(b)});
  if(tag){const b=el("button",{type:"button","class":"chip",text:"Skill: "+tag+"  \u00D7","aria-pressed":"true"});b.onclick=()=>{tag=null;render()};F.appendChild(b)}
  const list=PROJECTS.filter(p=>(cat==="All"||p.category===cat)&&(!tag||(p.tags||[]).includes(tag)));
  L.replaceChildren();
  if(!list.length)L.appendChild(el("p",{"class":"mono",text:"No projects match yet."}));
  list.forEach(p=>L.appendChild(card(p,PROJECTS.indexOf(p)+1)))}
render();
SKILLGROUPS.forEach(g=>{const d=el("div",{},[el("h3",{text:g.group})]);
  g.items.forEach(s=>{if(s.tag){const b=el("button",{type:"button","class":"chip",text:s.n});b.onclick=()=>{tag=s.tag;render();$("projects").scrollIntoView()};d.appendChild(b)}else d.appendChild(el("span",{"class":"chip",text:s.n}))});
  $("skg").appendChild(d)});
/* scroll spy */
const links=[...document.querySelectorAll(".top a")];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.setAttribute("aria-current",String(a.getAttribute("href")==="#"+e.target.id)))}),{rootMargin:"-40% 0px -55% 0px"});
["top","experience","projects","skills","contact"].forEach(id=>io.observe($(id)));
</script></body></html>
